[package]
name = "dcheck"
version = "0.4.0"
edition = "2021"
rust-version = "1.98.1"
description = "Device health check — storage identity, capacity, SMART health and life estimate"
license = "MIT"
repository = "https://github.com/mashanz/wayangos"
readme = "README.md"

[[bin]]
name = "dcheck"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
ratatui = "0.29.0"
