[package]
name = "wayang"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
description = "WayangOS A/B updater CLI (status, update, upgrade, rollback)"
publish = false

[[bin]]
name = "wayang"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
semver = "1"
tar = "0.4"
flate2 = "1"
hex = "0.4"
ratatui = "0.29.0"
# Shared HUD theme/widgets with wayang-fw and wayang-router (private repo).
wayang-tui = { git = "https://github.com/dalang-io/wayang-tui", tag = "v0.2.0" }
# Reset SIGPIPE to SIG_DFL for the CLI subcommands so `wayang status | head`
# terminates cleanly instead of aborting on a broken pipe.
libc = "0.2"
