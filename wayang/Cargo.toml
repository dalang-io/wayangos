[package]
name = "wayang"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "WayangOS A/B updater CLI (status, update, upgrade, rollback)"
publish = false

[[bin]]
name = "wayang"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
semver = "1"
tar = "0.4"
flate2 = "1"
hex = "0.4"
ratatui = "0.29.0"
