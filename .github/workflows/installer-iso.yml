name: Installer ISO + update bundle

# Build the bare-metal USB installer ISO (UEFI+BIOS hybrid) AND the signed
# update bundle (.wup) for the same kernel/rootfs, then publish them as release
# assets:
#   wayangos-installer.iso        drop onto a Ventoy USB or dd to a stick
#   wayang-<ver>-x86_64.wup       `wayang update` bundle
#   channel/stable/x86_64/manifest.json
#   SHA256SUMS
#
# Kernels are built from source; the build dir is cached.
#
# Signing (optional, recommended for releases):
#   secrets.WAYANG_SIGNING_KEY   ed25519 seed (64 hex) from `wayang keygen`
#   secrets.WAYANG_TRUSTED_KEYS  trusted_keys content ("release <64hex>") baked
#                                into the rootfs so installed systems trust it
#   secrets.WAYANG_KEYID         key id (default "release")
#
# Channel publishing (optional; tag builds only):
#   On a v* tag the update channel tree is rsynced to wayang.dalang.io with
#   scripts/publish-channel.sh. It is skipped with a ::notice:: when the deploy
#   secrets are absent (publish by hand instead). Required to enable it:
#     secrets.WAYANG_DEPLOY_HOST   ssh target, e.g. "root@10.0.0.251" — this is
#                                  the HOST publish-channel.sh defaults to; do
#                                  not change it here without also updating the
#                                  script.
#     secrets.WAYANG_DEPLOY_KEY    ssh PRIVATE key (OpenSSH PEM) authorised on
#                                  the deploy host for the update channel tree.
#   Optional overrides (otherwise the publish-channel.sh defaults apply):
#     secrets.WAYANG_DEPLOY_REMOTE_DIR       served dir
#                                            (default /root/wayang.dalang.io/public)
#     secrets.WAYANG_DEPLOY_CHANNEL_SUBDIR   subdir under it (default "channel")
#   Setup: generate a dedicated key on the deploy host
#     ssh-keygen -t ed25519 -f ~/.ssh/wayangos-ci -N ''
#   append ~/.ssh/wayangos-ci.pub to authorized_keys on the host, and store the
#   private key contents as WAYANG_DEPLOY_KEY (a repository secret). Only the
#   tag path publishes; workflow_dispatch never touches the live channel.
#
# Trigger: manual (workflow_dispatch) or a version tag (v*).

on:
  workflow_dispatch:
    inputs:
      kernel_config:
        description: Kernel config name in configs/
        default: defconfig-intel
      version:
        description: WayangOS version written to /etc/wayang/version
        default: "1.0.0"
      kernel_version:
        description: Kernel version (used in the ISO name and manifest)
        default: "7.2.7"
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  installer:
    runs-on: ubuntu-latest
    env:
      BUILD_DIR: ${{ github.workspace }}/wayangos-build
      KERNEL_CONFIG: ${{ github.event.inputs.kernel_config || 'defconfig-intel' }}
      KERNEL_VERSION: ${{ github.event.inputs.kernel_version || '7.2.7' }}
      CHANNEL: stable
      WAYANG_KEYID: ${{ secrets.WAYANG_KEYID || 'release' }}
      # tag ref_name looks like v1.4.1; strip the leading v below.
      WAYANG_VERSION: ${{ github.event.inputs.version || github.ref_name }}
      WAYANG_EDITION: installer
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential flex bison bc libelf-dev libssl-dev \
            cpio gzip xz-utils bzip2 unzip wget git \
            grub-pc-bin grub-efi-amd64-bin xorriso mtools

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Normalize version (strip leading v)
        run: echo "WAYANG_VERSION=${WAYANG_VERSION#v}" >> "$GITHUB_ENV"

      - name: Cache build directory
        uses: actions/cache@v4
        with:
          path: wayangos-build
          key: wayangos-build-${{ github.event.inputs.kernel_config || 'defconfig-intel' }}-v1

      - name: Fetch external sources
        run: ./scripts/fetch-sources.sh

      - name: Build updater + installer binaries
        run: |
          ./scripts/build-wayang.sh
          ./scripts/build-installer.sh

      - name: Prepare signing & trusted keys
        env:
          SIGNING_KEY: ${{ secrets.WAYANG_SIGNING_KEY }}
          TRUSTED: ${{ secrets.WAYANG_TRUSTED_KEYS }}
        run: |
          mkdir -p "$BUILD_DIR/keys"
          if [ -n "$SIGNING_KEY" ]; then
            printf '%s\n' "$SIGNING_KEY" > "$BUILD_DIR/keys/release.key"
            echo "WAYANG_SIGN_KEY=$BUILD_DIR/keys/release.key" >> "$GITHUB_ENV"
          else
            echo "::warning::WAYANG_SIGNING_KEY not set — update bundle will be UNSIGNED"
          fi
          if [ -n "$TRUSTED" ]; then
            printf '%s\n' "$TRUSTED" > "$BUILD_DIR/keys/trusted_keys"
            echo "WAYANG_TRUSTED_KEYS=$BUILD_DIR/keys/trusted_keys" >> "$GITHUB_ENV"
          elif [ -n "$SIGNING_KEY" ]; then
            echo "::warning::WAYANG_TRUSTED_KEYS not set — installed systems won't trust the new key"
          fi

      - name: Build kernel (${{ env.KERNEL_CONFIG }})
        run: ./scripts/build-kernel.sh "$KERNEL_CONFIG" bzImage-installer

      - name: Build nft (static, for wayang-fw)
        run: ./scripts/build-nft.sh

      - name: Build rootfs (updater + trusted keys)
        run: ./scripts/build-rootfs.sh

      - name: Build installer ISO
        run: |
          ISO="$BUILD_DIR/wayangos-${WAYANG_VERSION}-linux-${KERNEL_VERSION}-installer-x86_64.iso"
          ./scripts/build-installer-iso.sh \
            "$BUILD_DIR/bzImage-installer" \
            "$BUILD_DIR/wayangos-initramfs.img" \
            "$ISO"
          # stable alias for the landing "latest" link
          cp "$ISO" "$BUILD_DIR/wayangos-installer.iso"

      - name: Build update bundle + channel tree
        env:
          WAYANG_BIN: ${{ github.workspace }}/dist/wayang-x86_64-unknown-linux-musl
        run: |
          set -eu
          V="$BUILD_DIR/bzImage-installer"
          I="$BUILD_DIR/wayangos-initramfs.img"
          if [ -n "${WAYANG_SIGN_KEY:-}" ] && [ -x "$WAYANG_BIN" ]; then
            ./scripts/build-bundle.sh "$V" "$I" "$WAYANG_VERSION" x86_64 installer \
              --out "$BUILD_DIR" --channel "$CHANNEL" \
              --key "$WAYANG_SIGN_KEY" --keyid "$WAYANG_KEYID"
          else
            ./scripts/build-bundle.sh "$V" "$I" "$WAYANG_VERSION" x86_64 installer \
              --out "$BUILD_DIR" --channel "$CHANNEL"
          fi
          WUP="$BUILD_DIR/wayang-$WAYANG_VERSION-x86_64.wup"
          DEST="$BUILD_DIR/channel/$CHANNEL/x86_64"
          mkdir -p "$DEST"
          cp "$WUP" "$DEST/"
          tar -xzf "$WUP" -C "$DEST" manifest.json
          ( cd "$BUILD_DIR" && sha256sum \
              wayangos-installer.iso \
              "wayangos-${WAYANG_VERSION}-linux-${KERNEL_VERSION}-installer-x86_64.iso" \
              "$(basename "$WUP")" \
              "channel/$CHANNEL/x86_64/manifest.json" > SHA256SUMS )
          echo "=== release assets ==="; ls -l "$BUILD_DIR"/*.iso "$BUILD_DIR"/*.wup "$DEST"/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wayangos-release
          path: |
            wayangos-build/wayangos-installer.iso
            wayangos-build/wayangos-*-linux-*-installer-*.iso
            wayangos-build/wayang-*.wup
            wayangos-build/channel/**
            wayangos-build/SHA256SUMS

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            wayangos-build/wayangos-installer.iso
            wayangos-build/wayangos-${{ env.WAYANG_VERSION }}-linux-${{ env.KERNEL_VERSION }}-installer-x86_64.iso
            wayangos-build/wayang-${{ env.WAYANG_VERSION }}-x86_64.wup
            wayangos-build/channel/${{ env.CHANNEL }}/x86_64/manifest.json
            wayangos-build/SHA256SUMS

      # Best-effort publish of the update channel tree that devices poll at
      # https://wayang.dalang.io/channel/... Skipped with a ::notice:: when the
      # deploy secrets are absent, and continue-on-error so a transient deploy
      # failure never invalidates the release build. Host/destination come from
      # the secrets (see the header); the HOST default in publish-channel.sh is
      # the same box. Publish by hand with scripts/publish-channel.sh otherwise.
      - name: Publish update channel to wayang.dalang.io
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        env:
          DEPLOY_HOST: ${{ secrets.WAYANG_DEPLOY_HOST }}
          DEPLOY_KEY: ${{ secrets.WAYANG_DEPLOY_KEY }}
          DEPLOY_REMOTE_DIR: ${{ secrets.WAYANG_DEPLOY_REMOTE_DIR }}
          DEPLOY_CHANNEL_SUBDIR: ${{ secrets.WAYANG_DEPLOY_CHANNEL_SUBDIR }}
        run: |
          set -eu
          if [ -z "${DEPLOY_HOST:-}" ] || [ -z "${DEPLOY_KEY:-}" ]; then
            echo "::notice::WAYANG_DEPLOY_HOST / WAYANG_DEPLOY_KEY not set — skipping channel publish to wayang.dalang.io; run scripts/publish-channel.sh by hand"
            exit 0
          fi
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/wayang_deploy"
          chmod 600 "$HOME/.ssh/wayang_deploy"
          # Config is scoped to this job's HOME; accept-new trusts the host key
          # on first connect (pin it in known_hosts for a hardened setup).
          {
            echo "Host *"
            echo "  IdentityFile $HOME/.ssh/wayang_deploy"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking accept-new"
          } > "$HOME/.ssh/config"
          chmod 600 "$HOME/.ssh/config"
          export HOST="$DEPLOY_HOST"
          if [ -n "${DEPLOY_REMOTE_DIR:-}" ]; then export REMOTE_DIR="$DEPLOY_REMOTE_DIR"; fi
          if [ -n "${DEPLOY_CHANNEL_SUBDIR:-}" ]; then export CHANNEL_SUBDIR="$DEPLOY_CHANNEL_SUBDIR"; fi
          ./scripts/publish-channel.sh "$BUILD_DIR/channel"
