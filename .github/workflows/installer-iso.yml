name: Installer ISO + update bundle

# Build the bare-metal USB installer ISO (UEFI+BIOS hybrid) AND the signed
# update bundle (.wup) for the same kernel/rootfs, then publish them as release
# assets:
#   wayangos-installer.iso        drop onto a Ventoy USB or dd to a stick
#   wayang-<ver>-x86_64.wup       `wayang update` bundle
#   channel/stable/x86_64/manifest.json
#   SHA256SUMS
#
# Kernels are built from source; the build dir is cached.
#
# Signing (optional, recommended for releases):
#   secrets.WAYANG_SIGNING_KEY   ed25519 seed (64 hex) from `wayang keygen`
#   secrets.WAYANG_TRUSTED_KEYS  trusted_keys content ("release <64hex>") baked
#                                into the rootfs so installed systems trust it
#   secrets.WAYANG_KEYID         key id (default "release")
#
# Channel publishing (optional; best-effort):
#   The update channel tree that devices poll at
#   https://wayang.dalang.io/channel/<channel>/<arch>/... is rsynced with
#   scripts/publish-channel.sh. It runs in a separate `publish-channel` job
#   AFTER the ISO + signed .wup are built:
#     - on a v* tag, it publishes the tree produced by this run;
#     - on a manual dispatch, set the `publish_channel_version` input to
#       (re)publish an already-released version's channel WITHOUT rebuilding
#       (assets are re-downloaded from that GitHub release). Leave it empty to
#       do a normal build (which does not publish; use a tag for that).
#   A missing secret is skipped with a ::notice::, and the job is
#   continue-on-error, so a publish hiccup never fails the release. Details and
#   the on-disk layout: docs/CHANNEL.md.
#
#   Required repository secrets to ENABLE publishing:
#     WAYANG_DEPLOY_HOST   ssh target, e.g. "root@10.0.0.251" — the host the
#                          channel is synced to (publish-channel.sh defaults to
#                          the same value; only set this secret to override).
#     WAYANG_DEPLOY_KEY    ssh PRIVATE key (OpenSSH PEM) whose public half is
#                          authorised on the deploy host.
#   Optional override secrets (otherwise publish-channel.sh defaults apply):
#     WAYANG_DEPLOY_REMOTE_DIR       served dir (default /root/wayang.dalang.io/public)
#     WAYANG_DEPLOY_CHANNEL_SUBDIR   subdir under it (default "channel")
#
#   One-time setup:
#     1. Generate a dedicated deploy key (on the deploy host or locally):
#          ssh-keygen -t ed25519 -f ~/.ssh/wayangos-ci -N ''
#     2. Authorise the public half on the host that serves the channel:
#          cat ~/.ssh/wayangos-ci.pub >> ~/.ssh/authorized_keys   # on the host
#     3. Store the private key file's full contents as the repository secret
#        WAYANG_DEPLOY_KEY (Settings → Secrets and variables → Actions), and
#        set WAYANG_DEPLOY_HOST to the host's ssh target.
#     4. Verify with a manual run of this workflow: set publish_channel_version
#        to the current version and confirm the job succeeds and
#        https://wayang.dalang.io/channel/stable/x86_64/manifest.json updates.
#
# Trigger: manual (workflow_dispatch) or a version tag (v*).

on:
  workflow_dispatch:
    inputs:
      kernel_config:
        description: Kernel config name in configs/
        default: defconfig-intel
      version:
        description: WayangOS version written to /etc/wayang/version
        default: "1.0.0"
      kernel_version:
        description: Kernel version (used in the ISO name and manifest)
        default: "7.2.7"
      publish_channel_version:
        description: >-
          (Re)publish ONLY this version's already-released channel (e.g.
          1.0.17) via the publish-channel job, without rebuilding. Leave empty
          for a normal build (publishing happens on a v* tag).
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  installer:
    # A republish-only dispatch skips the (expensive) rebuild entirely; the
    # publish-channel job then reuses the released assets.
    if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.publish_channel_version != '') }}
    runs-on: ubuntu-latest
    env:
      BUILD_DIR: ${{ github.workspace }}/wayangos-build
      KERNEL_CONFIG: ${{ github.event.inputs.kernel_config || 'defconfig-intel' }}
      KERNEL_VERSION: ${{ github.event.inputs.kernel_version || '7.2.7' }}
      CHANNEL: stable
      WAYANG_KEYID: ${{ secrets.WAYANG_KEYID || 'release' }}
      # tag ref_name looks like v1.4.1; strip the leading v below.
      WAYANG_VERSION: ${{ github.event.inputs.version || github.ref_name }}
      WAYANG_EDITION: installer
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential flex bison bc libelf-dev libssl-dev \
            cpio gzip xz-utils bzip2 unzip wget git \
            grub-pc-bin grub-efi-amd64-bin xorriso mtools

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Normalize version (strip leading v)
        run: echo "WAYANG_VERSION=${WAYANG_VERSION#v}" >> "$GITHUB_ENV"

      - name: Cache build directory
        uses: actions/cache@v4
        with:
          path: wayangos-build
          key: wayangos-build-${{ github.event.inputs.kernel_config || 'defconfig-intel' }}-v1

      - name: Fetch external sources
        run: ./scripts/fetch-sources.sh

      - name: Build updater + installer binaries
        run: |
          ./scripts/build-wayang.sh
          ./scripts/build-installer.sh

      - name: Prepare signing & trusted keys
        env:
          SIGNING_KEY: ${{ secrets.WAYANG_SIGNING_KEY }}
          TRUSTED: ${{ secrets.WAYANG_TRUSTED_KEYS }}
        run: |
          mkdir -p "$BUILD_DIR/keys"
          if [ -n "$SIGNING_KEY" ]; then
            printf '%s\n' "$SIGNING_KEY" > "$BUILD_DIR/keys/release.key"
            echo "WAYANG_SIGN_KEY=$BUILD_DIR/keys/release.key" >> "$GITHUB_ENV"
          else
            echo "::warning::WAYANG_SIGNING_KEY not set — update bundle will be UNSIGNED"
          fi
          if [ -n "$TRUSTED" ]; then
            printf '%s\n' "$TRUSTED" > "$BUILD_DIR/keys/trusted_keys"
            echo "WAYANG_TRUSTED_KEYS=$BUILD_DIR/keys/trusted_keys" >> "$GITHUB_ENV"
          elif [ -n "$SIGNING_KEY" ]; then
            echo "::warning::WAYANG_TRUSTED_KEYS not set — installed systems won't trust the new key"
          fi

      - name: Build kernel (${{ env.KERNEL_CONFIG }})
        run: ./scripts/build-kernel.sh "$KERNEL_CONFIG" bzImage-installer

      - name: Build nft (static, for wayang-fw)
        run: ./scripts/build-nft.sh

      - name: Build router tools (static wg, tc, bird for wayang-router)
        run: |
          ./scripts/build-wg.sh
          ./scripts/build-iproute2.sh
          ./scripts/build-bird.sh

      # radvd (IPv6 router advertisements for the delegated /64) is optional:
      # the script warns and exits 0 when flex/bison or a static libc is
      # missing, so the image simply ships without it (wayang-router then
      # warns that no RAs are sent).
      - name: Build radvd (static, IPv6 RA; best-effort)
        run: ./scripts/build-radvd.sh || true

      # wayangi EdgeRouter agent (docs/EDGEROUTER.md). Best-effort: the script
      # exits 0 with a warning when no source checkout or release base URL is
      # available, so the image simply ships without it. Provide
      # `secrets.WAYANGI_BASE_URL` (e.g. https://wayangi.dalang.io/downloads) to
      # fetch a pinned binary; point `WAYANGI_SRC` at a checkout to build one.
      - name: Build wayangi agent (static, best-effort)
        env:
          WAYANGI_BASE_URL: ${{ secrets.WAYANGI_BASE_URL }}
        run: ./scripts/build-wayangi.sh || true

      - name: Build rootfs (updater + trusted keys)
        run: ./scripts/build-rootfs.sh

      - name: Build installer ISO
        run: |
          ISO="$BUILD_DIR/wayangos-${WAYANG_VERSION}-linux-${KERNEL_VERSION}-installer-x86_64.iso"
          ./scripts/build-installer-iso.sh \
            "$BUILD_DIR/bzImage-installer" \
            "$BUILD_DIR/wayangos-initramfs.img" \
            "$ISO"
          # stable alias for the landing "latest" link
          cp "$ISO" "$BUILD_DIR/wayangos-installer.iso"

      - name: Build update bundle + channel tree
        env:
          WAYANG_BIN: ${{ github.workspace }}/dist/wayang-x86_64-unknown-linux-musl
        run: |
          set -eu
          V="$BUILD_DIR/bzImage-installer"
          I="$BUILD_DIR/wayangos-initramfs.img"
          if [ -n "${WAYANG_SIGN_KEY:-}" ] && [ -x "$WAYANG_BIN" ]; then
            ./scripts/build-bundle.sh "$V" "$I" "$WAYANG_VERSION" x86_64 installer \
              --out "$BUILD_DIR" --channel "$CHANNEL" \
              --key "$WAYANG_SIGN_KEY" --keyid "$WAYANG_KEYID"
          else
            ./scripts/build-bundle.sh "$V" "$I" "$WAYANG_VERSION" x86_64 installer \
              --out "$BUILD_DIR" --channel "$CHANNEL"
          fi
          WUP="$BUILD_DIR/wayang-$WAYANG_VERSION-x86_64.wup"
          DEST="$BUILD_DIR/channel/$CHANNEL/x86_64"
          mkdir -p "$DEST"
          cp "$WUP" "$DEST/"
          tar -xzf "$WUP" -C "$DEST" manifest.json
          ( cd "$BUILD_DIR" && sha256sum \
              wayangos-installer.iso \
              "wayangos-${WAYANG_VERSION}-linux-${KERNEL_VERSION}-installer-x86_64.iso" \
              "$(basename "$WUP")" \
              "channel/$CHANNEL/x86_64/manifest.json" > SHA256SUMS )
          echo "=== release assets ==="; ls -l "$BUILD_DIR"/*.iso "$BUILD_DIR"/*.wup "$DEST"/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wayangos-release
          path: |
            wayangos-build/wayangos-installer.iso
            wayangos-build/wayangos-*-linux-*-installer-*.iso
            wayangos-build/wayang-*.wup
            wayangos-build/channel/**
            wayangos-build/SHA256SUMS

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            wayangos-build/wayangos-installer.iso
            wayangos-build/wayangos-${{ env.WAYANG_VERSION }}-linux-${{ env.KERNEL_VERSION }}-installer-x86_64.iso
            wayangos-build/wayang-${{ env.WAYANG_VERSION }}-x86_64.wup
            wayangos-build/channel/${{ env.CHANNEL }}/x86_64/manifest.json
            wayangos-build/SHA256SUMS


  # Best-effort publish of the update channel tree that devices poll at
  # https://wayang.dalang.io/channel/... Skipped with a ::notice:: when the
  # deploy secrets are absent, and continue-on-error so a transient deploy
  # failure never invalidates the release build. See the workflow header and
  # docs/CHANNEL.md for the secret names and one-time setup. Publish by hand
  # with scripts/publish-channel.sh otherwise.
  publish-channel:
    name: Publish update channel
    needs: installer
    # A v* tag publishes the tree built above; a republish-only dispatch skips
    # the build job, so use always() to still run.
    if: ${{ always() && ((startsWith(github.ref, 'refs/tags/') && needs.installer.result == 'success') || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_channel_version != '')) }}
    runs-on: ubuntu-latest
    # A publish hiccup must never fail the release.
    continue-on-error: true
    env:
      CHANNEL: stable
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version to publish
        env:
          PUBLISH_VERSION: ${{ github.event.inputs.publish_channel_version }}
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="$PUBLISH_VERSION"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          [ -n "$V" ] || { echo "ERROR: no version to publish" >&2; exit 1; }
          echo "CHANNEL_VERSION=$V" >> "$GITHUB_ENV"
          echo "publishing channel for $V"

      # Tag build: reuse the channel tree uploaded as an artifact in this run.
      - name: Download channel artifact (tag build)
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: actions/download-artifact@v4
        with:
          name: wayangos-release

      # Republish: reassemble the on-disk tree from the published release
      # (release assets are uploaded flat, so rename back into the layout).
      - name: Assemble channel tree from release assets (republish)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          DEST="wayangos-build/channel/$CHANNEL/x86_64"
          mkdir -p "$DEST"
          gh release download "v${CHANNEL_VERSION}" \
            --pattern manifest.json \
            --pattern "wayang-${CHANNEL_VERSION}-x86_64.wup" \
            --dir "$DEST"
          test -f "$DEST/manifest.json"
          test -f "$DEST/wayang-${CHANNEL_VERSION}-x86_64.wup"
          ls -l "$DEST"

      - name: Publish channel to wayang.dalang.io
        env:
          DEPLOY_HOST: ${{ secrets.WAYANG_DEPLOY_HOST }}
          DEPLOY_KEY: ${{ secrets.WAYANG_DEPLOY_KEY }}
          DEPLOY_REMOTE_DIR: ${{ secrets.WAYANG_DEPLOY_REMOTE_DIR }}
          DEPLOY_CHANNEL_SUBDIR: ${{ secrets.WAYANG_DEPLOY_CHANNEL_SUBDIR }}
        run: |
          set -eu
          if [ -z "${DEPLOY_HOST:-}" ] || [ -z "${DEPLOY_KEY:-}" ]; then
            echo "::notice::WAYANG_DEPLOY_HOST / WAYANG_DEPLOY_KEY not set — skipping channel publish to wayang.dalang.io; run scripts/publish-channel.sh by hand"
            exit 0
          fi
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/wayang_deploy"
          chmod 600 "$HOME/.ssh/wayang_deploy"
          export WAYANG_DEPLOY_HOST="$DEPLOY_HOST"
          export WAYANG_DEPLOY_SSH_KEY="$HOME/.ssh/wayang_deploy"
          if [ -n "${DEPLOY_REMOTE_DIR:-}" ]; then export WAYANG_DEPLOY_REMOTE_DIR="$DEPLOY_REMOTE_DIR"; fi
          if [ -n "${DEPLOY_CHANNEL_SUBDIR:-}" ]; then export WAYANG_DEPLOY_CHANNEL_SUBDIR="$DEPLOY_CHANNEL_SUBDIR"; fi
          # The script applies StrictHostKeyChecking=accept-new when the key is
          # set; pin the host key in known_hosts for a hardened setup.
          ./scripts/publish-channel.sh "wayangos-build/channel"
